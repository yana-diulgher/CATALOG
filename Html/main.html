<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Css/style.css">
    <title>Каталог</title>
</head>
<body>
    <header>
    <div class="header">
         <p>Каталог
        <select name="catalog" id="catalog">
            <option value="men's_jacket">Мужчкие куртки</option>
            <option value="women's_jacket">Женские куртки</option>
            <option value="children's_jacket">Детские куртки</option>
        </select>
    </p>
    
    <p>Клиент
        <select name="client" id="client">
            <option value="Fashion">Fashion</option>
            <option value="Tagaer">Tagaer</option>
            <option value="KOS">K.O.S.</option>
        </select>
    </p>

    <p>Валюта
        <select name="currency" id="currency">
            <option value="mdl">Лей</option>
            <option value="usd">Доллар</option>
            <option value="eur">Евро</option>
        </select>
    </p>
    </div>
   
    </header>
    <main>
        <table id="productTable">
            <thead>
                <tr>
                    <th>Код</th>
                    <th>Наименование</th>
                    <th>Размер</th>
                    <th>Количество</th>
                    <th>Цена</th>
                </tr>
            </thead>
            <tbody>
                <!-- дабавление строк таблицы будет происходить здесь с помощью JavaScript -->
            </tbody>
        </table>
    </main>


    <footer>
        <p>&copy; 2026 Каталог курток. Каталог сделан в целях обучения.</p>
        <p>Автор: Яна Д.</p>
    </footer>
    <script src="../JavaScript/script.js"></script>
</body>

</html>
